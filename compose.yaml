name: techzu

x-app-build: &app-build
    context: .
    target: app
    args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Techzu Support}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-techzu-local-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}

x-app-volumes: &app-volumes
    - type: bind
      source: ./.env
      target: /var/www/html/.env
      bind:
          create_host_path: false
    - type: volume
      source: storage
      target: /var/www/html/storage

x-laravel: &laravel
    image: techzu-app:local
    build: *app-build
    volumes: *app-volumes
    restart: unless-stopped
    depends_on:
        init:
            condition: service_completed_successfully

services:
    init:
        image: techzu-app:local
        build: *app-build
        user: root
        command: ['init']
        volumes: *app-volumes
        restart: 'no'
        depends_on:
            mysql:
                condition: service_healthy

    app:
        <<: *laravel
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
                ]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 10s

    web:
        image: techzu-web:local
        build:
            context: .
            target: web
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Techzu Support}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-techzu-local-key}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        ports:
            - '${APP_PORT:-8000}:80'
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped

    queue:
        <<: *laravel
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--queue=default,broadcasts,notifications,imports',
                '--tries=3',
            ]
        stop_grace_period: 30s

    scheduler:
        <<: *laravel
        command: ['php', 'artisan', 'schedule:work']

    reverb:
        <<: *laravel
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${VITE_REVERB_PORT:-8080}:8080'

    mysql:
        image: mysql:8.4
        command:
            [
                '--character-set-server=utf8mb4',
                '--collation-server=utf8mb4_unicode_ci',
            ]
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-techzu}
            MYSQL_USER: ${DB_USERNAME:-techzu}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        ports:
            - '127.0.0.1:${DB_FORWARD_PORT:-3307}:3306'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 40
            start_period: 20s
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:v1.27
        ports:
            - '${MAILPIT_UI_PORT:-8025}:8025'
        restart: unless-stopped

volumes:
    mysql-data:
    storage:
